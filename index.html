<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clearing Cache & Resetting Session...</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e74c3c;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h3 {
            margin-bottom: 10px;
            color: #2c3e50;
            font-size: 18px;
        }
        p {
            color: #7f8c8d;
            font-size: 14px;
            line-height: 1.5;
        }
        .success-msg {
            color: #27ae60;
            font-weight: bold;
            display: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner" id="loadingSpinner"></div>
        <h3>පද්ධතියේ කෑෂ් සහ සෙෂන් ඉවත් කරමින් පවතී...</h3>
        <p>කරුණාකර මොහොතක් රැඳී සිටින්න. ඔබව ලොගින් පිටුව වෙත යොමු කෙරේ.</p>
        <div class="success-msg" id="successText">සියලු දත්ත සාර්ථකව ඉවත් විය!</div>
    </div>

    <script>
        // 1. LocalStorage සහ SessionStorage සම්පූර්ණයෙන්ම ඉවත් කිරීම
        localStorage.clear();
        sessionStorage.clear();

        // 2. සියලු කුකීස් (Cookies) ඉවත් කිරීම
        document.cookie.split(";").forEach(function(c) { 
            document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"); 
        });

        // 3. පැරණි කෑෂ් මඟහැරීම සඳහා Service Worker එකක් ඇත්නම් එයUnregister කිරීම
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });
        }

        // 4. තත්පර 1.5කට පසු upto.lk ලොගින් පිටුවට අලුත්ම timestamp එකක් සමඟ යැවීම
        setTimeout(function() {
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('successText').style.display = 'block';
            
            setTimeout(function() {
                // cache bypass කිරීම සඳහා timestamp එකක් එකතු කර ඇත
                window.location.href = 'https://upto.lk/login?nocache=' + new Date().getTime();
            }, 800);
        }, 1500);
    </script>

</body>
</html>
